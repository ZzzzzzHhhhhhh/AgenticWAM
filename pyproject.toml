[project]
name = "agenticwam"
version = "0.3.0"
description = "Task-independent orchestration for language-conditioned robot policies."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
mcp = ["mcp>=1.28,<2"]

[project.scripts]
agenticwam = "agenticwam.cli:main"

[project.urls]
Repository = "https://github.com/ZzzzzzHhhhhhh/AgenticWAM"
Documentation = "https://github.com/ZzzzzzHhhhhhh/AgenticWAM#readme"
Issues = "https://github.com/ZzzzzzHhhhhhh/AgenticWAM/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agenticwam"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["SIM108"]
