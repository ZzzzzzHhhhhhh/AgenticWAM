name: AgenticWAM
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[dev,mcp]' build
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest -q
      - run: python -m build
      - name: Check installed wheel outside checkout
        run: |
          python -m venv "$RUNNER_TEMP/agenticwam-smoke"
          "$RUNNER_TEMP/agenticwam-smoke/bin/python" -m pip install --no-deps dist/agenticwam-*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/agenticwam-smoke/bin/agenticwam" --help
          "$RUNNER_TEMP/agenticwam-smoke/bin/agenticwam" demo --scenario mixed
          "$RUNNER_TEMP/agenticwam-smoke/bin/agenticwam" demo --scenario plates
